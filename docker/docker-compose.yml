name: agrimitra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrimitra}
      POSTGRES_USER: ${POSTGRES_USER:-agrimitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrimitra} -d ${POSTGRES_DB:-agrimitra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      ENV: production
      DEBUG: "false"
      # SECRET_KEY and POSTGRES_PASSWORD come from docker/.env — never commit real values
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrimitra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agrimitra}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      MARKET_DATA_PROVIDER: demo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
